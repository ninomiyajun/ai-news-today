# ハーネスの設定。scripts/harness/check-docs.sh・notify.sh・drift-scan.sh が読む。文書から読めない値だけを置く
# （層、依存の向き、地図のパス、検査の一覧、古い計画の日数は文書から読む）。キーの意味は check-docs.sh の冒頭にある。
# 形: 1 行に 1 つの「キー=値」。行頭が # の行と空の行は注釈。値の後ろに注釈を書かない（# も値の一部になる）。
# このファイルはプロジェクトが正本で、手で直してよい。直した後に文書の検査を流す。
format=1
# AGENTS.md の行数の上限
agents_max_lines=120
# ハーネスの版 1 の必須のファイル（1 行に 1 つ。末尾が / のものはディレクトリ）
required.1=AGENTS.md
required.1=CLAUDE.md
required.1=ARCHITECTURE.md
required.1=.gitignore
required.1=docs/adr/README.md
required.1=docs/PLANS.md
required.1=docs/exec-plans/active/
required.1=docs/exec-plans/completed/
required.1=docs/QUALITY_SCORE.md
required.1=docs/quality-eval/README.md
required.1=docs/quality-eval/tasks/
required.1=docs/quality-eval/results/
required.1=scripts/harness/check-docs.sh
required.1=scripts/harness/check-arch.sh
required.1=scripts/harness/check-secrets.sh
required.1=scripts/harness/check-secrets.mjs
required.1=.dependency-cruiser.cjs
required.1=.secretlintrc.json
required.1=.github/workflows/harness.yml
required.1=.github/dependabot.yml
# yes: CLAUDE.md が「@AGENTS.md」の 1 行と完全に一致することを求める。no: 「@AGENTS.md」だけの行があればよい
claude_md_exact=yes
# ARCHITECTURE.md に書いたパスとして拾う、先頭のディレクトリ（空白で区切る）
arch_path_prefixes=src docs scripts .github templates
# ARCHITECTURE.md に書いたパスとして拾う、根の直下のファイルの拡張子（空白で区切る）
arch_root_file_exts=md cjs mjs ts json yml
# 既定のブランチ（検査の由来の記録の分岐元と、定期の走査が使う）
default_branch=main
# 敷いたときに採用した部品（1 行に 1 つ。project-harness-init の更新の手順が、置き換える写しを選ぶのに使う）
part=node-harness
part=node-secrets
# 検査の由来の記録を求めない、版だけの置き換えの行の形（何行でも。perl の正規表現で、名前の部分の捕獲 name と版の部分の捕獲 ver を持つ。行から ver の部分を除いた残りが変わる置き換えは、記録を求める）。
# 次の行は、CI のアクションを 40 桁のコミットで固定した行の、版の置き換え
record_exempt_line_re=^\s*-?\s*uses:[ \t]*(?<name>[^@\s]+)@(?<ver>[0-9a-f]{40}(\s+#.*)?)$
# package.json の依存の版だけを置き換える行（検査の由来の記録を求めない）
record_exempt_line_re=^\s*"(?<name>[@A-Za-z0-9._/-]+)":\s*"(?<ver>[~^]?[0-9][0-9A-Za-z.+-]*)",?\s*$
# 敷いたひな形の規約の版（project-harness-init の更新の手順が、差分を出すのに使う）
template_version=rules-2026.10.28-1
